service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: Ngưỡng 3000ms bảo vệ trải nghiệm chờ của người dùng và thống nhất với đường SLO trên panel latency; target 99.5% vẫn dành một error budget nhỏ cho lỗi phụ thuộc ngoài hoặc tail latency.
  budget_example: Với 10,000 request trong cửa sổ 28 ngày, error budget 0.5% cho phép tối đa 50 request lỗi hoặc có latency lớn hơn 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
